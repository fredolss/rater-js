name: Deploy demo to GitHub Pages

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Cache-bust example scripts
        run: |
          # jekyll-build-pages runs as root in a container, so _site is
          # root-owned; reclaim it so sed -i can write its temp file.
          sudo chown -R "$(id -u):$(id -g)" _site
          SHORT_SHA="${GITHUB_SHA:0:7}"
          sed -i \
            -e "s#src=\"\.\./dist/rater-js\.iife\.min\.js\"#src=\"../dist/rater-js.iife.min.js?v=${SHORT_SHA}\"#" \
            -e "s#src=\"index\.js\"#src=\"index.js?v=${SHORT_SHA}\"#" \
            _site/example/index.html

      - name: Verify Pages artifact
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          test -f _site/index.html
          grep -Fiq 'rater-js' _site/index.html
          test -f _site/favicon.ico
          grep -Fq 'href="/favicon.ico"' _site/index.html
          test -f _site/example/index.html
          test -f _site/example/index.js
          test -f _site/example/favicon.ico
          test -f _site/dist/rater-js.iife.min.js
          grep -Fq "../dist/rater-js.iife.min.js?v=${SHORT_SHA}" _site/example/index.html
          grep -Fq "index.js?v=${SHORT_SHA}" _site/example/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
