<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="55%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="starFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <clipPath id="halfClipBig">
      <rect x="-90" y="-90" width="90" height="180"/>
    </clipPath>
    <clipPath id="halfClipSmall">
      <rect x="-13" y="-13" width="13" height="26"/>
    </clipPath>

    <!-- Reusable small star path, centered at origin, outer r=13 -->
    <path id="starSmall" d="M 0,-13 L 2.94,-4.05 L 12.36,-4.02 L 4.76,1.55 L 7.64,10.52 L 0,5 L -7.64,10.52 L -4.76,1.55 L -12.36,-4.02 L -2.94,-4.05 Z"/>

    <!-- Big star for the badge (outer r=90, matches icon proportions) -->
    <path id="starBig" d="M0 -74 L26 -8 L98 -8 L40 32 L58 96 L0 58 L-58 96 L-40 32 L-98 -8 L-26 -8 Z"/>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="320" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="320" fill="url(#glow)"/>

  <!-- Faint scattered texture stars -->
  <g fill="#ffffff" opacity="0.06">
    <use xlink:href="#starSmall" href="#starSmall" transform="translate(950,60) scale(0.7)"/>
    <use xlink:href="#starSmall" href="#starSmall" transform="translate(1050,180) scale(1.1)"/>
    <use xlink:href="#starSmall" href="#starSmall" transform="translate(880,230) scale(0.5)"/>
    <use xlink:href="#starSmall" href="#starSmall" transform="translate(1120,90) scale(0.8)"/>
    <use xlink:href="#starSmall" href="#starSmall" transform="translate(1000,270) scale(0.6)"/>
  </g>

  <!-- Icon badge -->
  <g transform="translate(150,160)">
    <rect x="-100" y="-100" width="200" height="200" rx="44" fill="url(#badgeGrad)"/>
    <rect x="-92" y="-92" width="184" height="184" rx="38" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>
    <g transform="translate(0,-6)">
      <use xlink:href="#starBig" href="#starBig" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
      <use xlink:href="#starBig" href="#starBig" fill="url(#starFill)" clip-path="url(#halfClipBig)"/>
      <use xlink:href="#starBig" href="#starBig" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="290" y="175" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="76" fill="#ffffff" letter-spacing="-1">rater<tspan fill="#FDE047">-js</tspan></text>

  <!-- Tagline -->
  <text x="292" y="212" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="22" fill="#C7D2FE" opacity="0.85">Star rating widget for the browser. No dependencies.</text>

  <!-- Decorative 4.5/5 star rating row -->
  <g transform="translate(292,250)">
    <g fill="url(#starFill)">
      <use xlink:href="#starSmall" href="#starSmall" transform="translate(13,13) scale(1.3)"/>
      <use xlink:href="#starSmall" href="#starSmall" transform="translate(53,13) scale(1.3)"/>
      <use xlink:href="#starSmall" href="#starSmall" transform="translate(93,13) scale(1.3)"/>
      <use xlink:href="#starSmall" href="#starSmall" transform="translate(133,13) scale(1.3)"/>
    </g>
    <g transform="translate(173,13) scale(1.3)">
      <use xlink:href="#starSmall" href="#starSmall" fill="none" stroke="#FDE047" stroke-width="1.4" stroke-linejoin="round"/>
      <use xlink:href="#starSmall" href="#starSmall" fill="#FDE047" clip-path="url(#halfClipSmall)"/>
    </g>
    <text x="215" y="19" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="500" font-size="16" fill="#C7D2FE" opacity="0.8">4.5 / 5</text>
  </g>
</svg>
